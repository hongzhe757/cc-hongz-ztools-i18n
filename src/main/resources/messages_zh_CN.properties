# ============================================
# 通用消息 - 中文（key 为业务状态码）
# ============================================

# 成功
COMMON_000=操作成功

# 参数校验
COMMON_400=参数无效：{0}

# 认证授权
COMMON_401=未授权，请先登录
COMMON_403=禁止访问，权限不足

# 资源相关
COMMON_404=资源不存在
COMMON_405=请求方法不允许
COMMON_409=资源冲突：{0}

# 系统错误
COMMON_500=系统内部错误
COMMON_501=功能未实现
COMMON_503=服务暂不可用，请稍后重试
COMMON_504=网关超时

# 请求限流 / 超时
COMMON_408=请求超时
COMMON_429=请求过于频繁，请稍后再试
