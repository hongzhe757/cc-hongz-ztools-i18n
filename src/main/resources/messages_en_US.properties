# ============================================
# Common Messages - English (key = business status code)
# ============================================

# Success
COMMON_000=Operation successful

# Parameter Validation
COMMON_400=Invalid parameter: {0}

# Authentication & Authorization
COMMON_401=Unauthorized, please login first
COMMON_403=Forbidden, insufficient permissions

# Resource Related
COMMON_404=Resource not found
COMMON_405=Method not allowed
COMMON_409=Resource conflict: {0}

# System Errors
COMMON_500=Internal server error
COMMON_501=Not implemented
COMMON_503=Service unavailable, please try again later
COMMON_504=Gateway timeout

# Rate Limit / Timeout
COMMON_408=Request timeout
COMMON_429=Too many requests, please try again later
